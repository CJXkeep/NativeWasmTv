apply plugin: 'com.android.application'

import groovy.json.JsonOutput
import java.security.MessageDigest

def releaseSigningDirectory = rootProject.file('.signing')
def releaseKeystore = new File(releaseSigningDirectory, 'iptv-release.jks')
def releaseSigningInfo = new File(releaseSigningDirectory, 'keystore-info.properties')
def releaseSigningAvailable = releaseKeystore.isFile() && releaseSigningInfo.isFile()
if (releaseKeystore.exists() != releaseSigningInfo.exists()) {
    throw new GradleException('Both .signing/iptv-release.jks and '
            + '.signing/keystore-info.properties are required for release signing.')
}
def releaseSigningProperties = new Properties()
def configuredVersionCode = project.hasProperty('versionCodeOverride')
        ? Integer.parseInt(project.property('versionCodeOverride').toString()) : 7
// I4 诊断发送：接收端凭据默认**不注入**。
// 理由：BuildConfig 常量会随 APK 分发，反编译即可提取；控制页「诊断与更新 → 高级」可覆盖配置。
// 自用构建可用 -PdiagnosticWebhook= / -PdiagnosticSecret= 注入，但禁止随公开发布（见文件末尾守卫）。
def diagnosticWebhook = (project.findProperty('diagnosticWebhook') ?: '').toString().trim()
def diagnosticSecret = (project.findProperty('diagnosticSecret') ?: '').toString().trim()
def buildConfigString = { Object value ->
    String text = value == null ? '' : value.toString()
    '"' + text.replace('\\', '\\\\').replace('"', '\\"') + '"'
}
if (releaseSigningAvailable) {
    releaseSigningInfo.withInputStream { releaseSigningProperties.load(it) }
    ['alias', 'storePassword', 'keyPassword'].each { propertyName ->
        if (!releaseSigningProperties.getProperty(propertyName)) {
            throw new GradleException("Missing ${propertyName} in "
                    + '.signing/keystore-info.properties')
        }
    }
}

android {
    compileSdkVersion 30
    buildToolsVersion '27.0.3'

    signingConfigs {
        if (releaseSigningAvailable) {
            iptvRelease {
                storeFile releaseKeystore
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('alias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }

    defaultConfig {
        applicationId project.hasProperty('applicationIdOverride')
                ? project.property('applicationIdOverride').toString() : 'xiao.bu.tv'
        minSdkVersion 14
        // API 25 keeps the legacy package-installer flow without declaring
        // REQUEST_INSTALL_PACKAGES, while remaining installable on Android 15.
        targetSdkVersion 25
        versionCode configuredVersionCode
        versionName '1.7.0'
        testInstrumentationRunner 'xiao.bu.tv.QuickJsInstrumentation'
        // I4 诊断发送（决策 7）：-PdiagnosticWebhook / -PdiagnosticSecret / -PdiagnosticKeyword
        // 默认留空：凭据不进源码、不进仓库、不进公开 APK，由控制页「高级」在设备上配置。
        buildConfigField 'String', 'DIAGNOSTIC_WEBHOOK', buildConfigString(diagnosticWebhook)
        buildConfigField 'String', 'DIAGNOSTIC_SECRET', buildConfigString(diagnosticSecret)
        buildConfigField 'String', 'DIAGNOSTIC_KEYWORD',
                buildConfigString(project.findProperty('diagnosticKeyword') ?: 'nTv')
        // 仅测试用（I4 E 组回归）：-PupdateManifestUrlOverride=http://host:port/version.json
        // 为空时走正式 GitHub Release 清单；非空时允许本地清单与任意 APK 地址，用于验证自动更新全链路。
        buildConfigField 'String', 'UPDATE_MANIFEST_OVERRIDE',
                buildConfigString(project.findProperty('updateManifestUrlOverride') ?: '')
    }

    flavorDimensions 'architecture'
    productFlavors {
        arm32 {
            dimension 'architecture'
            minSdkVersion 14
            ndk { abiFilters 'armeabi-v7a' }
            buildConfigField 'String', 'CJS_PLUGIN_ABI', '"armeabi-v7a"'
            buildConfigField 'String', 'UPDATE_APK_URL_FIELD', '"apk32Url"'
            buildConfigField 'String', 'UPDATE_SHA256_FIELD', '"sha25632"'
            buildConfigField 'String', 'UPDATE_APK_ASSET', '"nTv.apk"'
        }
        arm64 {
            dimension 'architecture'
            // Android supports 64-bit native processes from API 21 onward.
            minSdkVersion 21
            ndk { abiFilters 'arm64-v8a' }
            buildConfigField 'String', 'CJS_PLUGIN_ABI', '"arm64-v8a"'
            buildConfigField 'String', 'UPDATE_APK_URL_FIELD', '"apk64Url"'
            buildConfigField 'String', 'UPDATE_SHA256_FIELD', '"sha25664"'
            buildConfigField 'String', 'UPDATE_APK_ASSET', '"nTv64.apk"'
        }
    }

    buildTypes {
        debug {
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.iptvRelease
            }
            buildConfigField 'boolean', 'EMBED_CONTROL_PAGES', 'true'
            buildConfigField 'String', 'RECOMMENDED_JOY_SOURCE_URL',
                    '"https://raw.githubusercontent.com/buhanzhe/webSourceM3U8/refs/heads/main/JoyPage.txt"'
            buildConfigField 'String', 'RECOMMENDED_WEBVIEW_SOURCE_URL',
                    '"https://raw.githubusercontent.com/buhanzhe/webSourceM3U8/refs/heads/main/webview.txt"'
        }
        release {
            minifyEnabled false
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.iptvRelease
            }
            buildConfigField 'boolean', 'EMBED_CONTROL_PAGES', 'false'
            buildConfigField 'String', 'RECOMMENDED_JOY_SOURCE_URL',
                    '"https://github.com/buhanzhe/webSourceM3U8/releases/latest/download/JoyPage.txt"'
            buildConfigField 'String', 'RECOMMENDED_WEBVIEW_SOURCE_URL',
                    '"https://github.com/buhanzhe/webSourceM3U8/releases/latest/download/webview.txt"'
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jni.srcDirs = []
            jniLibs.srcDirs = ['src/main/libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    // 3.12.x is the final OkHttp branch that supports Android 4.4 and Java 7.
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:3.12.13'
    // JVM regression checks (app/src/test) run without a device or network.
    testImplementation 'junit:junit:4.12'
}

tasks.withType(Test) {
    // 内置源是这些用例的真实输入：Gradle 默认看不见它，改坏源不会让测试重跑。
    inputs.file(rootProject.file('app/src/main/assets/builtin_channels.txt'))
            .withPropertyName('builtinChannels')
}

task generateVersionFile {
    group = 'distribution'
    description = 'Generate the GitHub update manifest at the repository root.'

    doLast {
        Closure<String> fileSha256 = { String propertyName ->
            if (!project.hasProperty(propertyName)) {
                return ''
            }
            File apkFile = rootProject.file(project.property(propertyName))
            if (!apkFile.isFile()) {
                throw new GradleException("Update APK does not exist: ${apkFile}")
            }
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            apkFile.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, count)
                }
            }
            return digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        }
        String sha25632 = fileSha256('updateApk32')
        String sha25664 = fileSha256('updateApk64')
        if (!sha25632 || !sha25664) {
            throw new GradleException('Both -PupdateApk32 and -PupdateApk64 are required')
        }
        String releaseBase = 'https://github.com/CJXkeep/NativeWasmTv/releases/latest/download/'

        def manifest = [
                versionCode : android.defaultConfig.versionCode,
                versionName : android.defaultConfig.versionName,
                // apkUrl/sha256 keep every released 32-bit updater backward compatible.
                apkUrl      : releaseBase + 'nTv.apk',
                apk32Url    : releaseBase + 'nTv.apk',
                apk64Url    : releaseBase + 'nTv64.apk',
                sha256      : sha25632,
                sha25632    : sha25632,
                sha25664    : sha25664,
                releaseNotes: project.findProperty('releaseNotes') ?: '修复问题并提升播放体验。'
        ]
        String manifestJson = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n'
        File output = rootProject.file('version.json')
        File legacyOutput = rootProject.file('version-iptv.json')
        output.setText(manifestJson, 'UTF-8')
        legacyOutput.setText(manifestJson, 'UTF-8')
        logger.lifecycle("Generated ${output} and ${legacyOutput} (arm32=${sha25632 ?: 'unset'}, "
                + "arm64=${sha25664 ?: 'unset'})")
    }
}

// 诊断接收凭据一旦注入就是 BuildConfig 常量，反编译 APK 即可提取，
// 因此带凭据的 release 包必须显式确认，避免「自用构建参数忘了清」导致误发布。
gradle.taskGraph.whenReady { taskGraph ->
    boolean releaseBuild = taskGraph.allTasks.any { task ->
        boolean packagingTask = task.name.startsWith('assemble') || task.name.startsWith('bundle')
        packagingTask && task.name.toLowerCase().contains('release')
    }
    boolean embeddedCredential =
            diagnosticWebhook.length() > 0 || diagnosticSecret.length() > 0
    if (releaseBuild && embeddedCredential
            && !project.hasProperty('allowEmbeddedDiagnosticCredential')) {
        throw new GradleException('拒绝构建带诊断凭据的 release 包：'
                + '注入的接收地址/加签密钥会随 APK 分发并可被反编译提取。'
                + '请改在控制页「诊断与更新 → 高级」里配置，'
                + '或确认只在自用时加 -PallowEmbeddedDiagnosticCredential=true。')
    }
    if (embeddedCredential) {
        logger.lifecycle('[nTv] 已注入诊断接收凭据：仅限自用构建，请勿随公开发布。')
    }
}
